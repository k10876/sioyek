name: Android Build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
      - 'pdf_viewer/**'
      - 'pdf_viewer_build_config.pro'
      - 'CMakeLists.txt'

env:
  QT_VERSION: '6.7.2'
  QT_ANDROID_ARCH: 'android_arm64_v8a'
  ANDROID_API_LEVEL: '33'
  ANDROID_NDK_VERSION: '23.1.7779620'

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: ${{ env.ANDROID_API_LEVEL }}
        build-tools: '33.0.2'
        ndk-version: ${{ env.ANDROID_NDK_VERSION }}

    - name: Install Qt for Android
      uses: jurplel/install-qt-action@v4
      with:
        version: ${{ env.QT_VERSION }}
        host: 'linux'
        target: 'android'
        arch: ${{ env.QT_ANDROID_ARCH }}
        modules: 'qtsvg'
        cache: true

    - name: Build MuPDF and OpenSSL dependencies
      run: |
        set -euxo pipefail
        mkdir -p libs
        curl -L https://github.com/KDAB/android_openssl/raw/master/ssl_3/arm64-v8a/libssl_3.so -o libs/libssl_3.so
        curl -L https://github.com/KDAB/android_openssl/raw/master/ssl_3/arm64-v8a/libcrypto_3.so -o libs/libcrypto_3.so
        cd mupdf/platform/java
        ./gradlew assembleRelease -PABI_FILTERS=arm64-v8a
        cd ../..
        MUPDF_LIB=$(find mupdf -name "libmupdf_java.so" -path "*arm64-v8a*" | head -n 1)
        if [ -z "$MUPDF_LIB" ]; then
          echo "MuPDF android library not found"
          exit 1
        fi
        cp "$MUPDF_LIB" libs/libmupdf_java.so

    - name: Configure project with qmake
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
      run: |
        set -euxo pipefail
        QT_ANDROID="$HOME/Qt/${QT_VERSION}/${QT_ANDROID_ARCH}"
        "$QT_ANDROID/bin/qmake" -spec android-clang \
          "ANDROID_ABIS=arm64-v8a" \
          "ANDROID_TARGET_ARCH=arm64-v8a" \
          CONFIG+=release \
          pdf_viewer_build_config.pro

    - name: Build Android binaries
      run: |
        set -euxo pipefail
        make -j"$(nproc)"

    - name: Package APK
      env:
        ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
        ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
      run: |
        set -euxo pipefail
        DEPLOY_JSON=$(find . -name "*-deployment-settings.json" | head -n 1)
        if [ -z "$DEPLOY_JSON" ]; then
          echo "Deployment settings file not found"
          exit 1
        fi
        QT_ANDROID="$HOME/Qt/${QT_VERSION}/${QT_ANDROID_ARCH}"
        "$QT_ANDROID/bin/androiddeployqt" \
          --input "$DEPLOY_JSON" \
          --output android-build \
          --android-platform android-${ANDROID_API_LEVEL} \
          --gradle \
          --release
        APK_PATH=$(find android-build -name "*.apk" | head -n 1 || true)
        if [ -z "$APK_PATH" ]; then
          echo "APK not found"
          exit 1
        fi
        echo "APK_PATH=$APK_PATH" >> "$GITHUB_ENV"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: sioyek-android-arm64-v8a
        path: ${{ env.APK_PATH }}
