name: Test Build Android APK

on:
  workflow_dispatch:

jobs:
  run-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Locate build APK folder
        id: apk
        run: |
          apk_dir="$(find build_apk -mindepth 1 -maxdepth 1 -type d | sort | tail -n 1)"
          if [ -z "$apk_dir" ]; then
            echo "No build_apk subdirectory found" >&2
            exit 1
          fi
          echo "apk_dir=$apk_dir" >> "$GITHUB_OUTPUT"
          find "$apk_dir" -maxdepth 1 -name '*.apk' | sort

      - uses: ReactiveCircus/android-emulator-runner@v2.37.0
        with:
          api-level: 30
          target: google_apis
          arch: arm64-v8a
          profile: pixel_4
          emulator-options: -no-snapshot -noaudio -no-boot-anim
          script: |
            set -euo pipefail
            apk_dir='${{ steps.apk.outputs.apk_dir }}'
            adb logcat -c
            for apk in "$apk_dir"/*.apk; do
              echo "Installing $apk"
              adb install -r "$apk"
            done
            echo "Launching info.sioyek.sioyek"
            adb shell monkey -p info.sioyek.sioyek -c android.intent.category.LAUNCHER 1
            sleep 10
            echo "Recent logcat output"
            adb logcat -d -v time | tail -n 300
