name: Android ARM64 Debug APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android_arm64_debug.yml'
      - 'android/**'
      - 'pdf_viewer_build_config.pro'
      - 'pdf_viewer/**'

jobs:
  build-android-arm64-debug:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.7.2'
          target: 'android'
          arch: 'android_arm64_v8a'
          modules: 'qt5compat qtmultimedia'
          cache: true

      - name: Configure Android SDK/NDK for Qt
        env:
          QT_ROOT_DIR: ${{ env.QT_ROOT_DIR }}
        run: |
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$ANDROID_NDK_ROOT" >> "$GITHUB_ENV"
          echo "QT_ANDROID_KEYSTORE_PATH=" >> "$GITHUB_ENV"

      - name: Build unsigned debug APK (arm64-v8a)
        run: |
          set -euxo pipefail
          "$QT_ROOT_DIR/bin/qmake" pdf_viewer_build_config.pro \
            CONFIG+=debug \
            ANDROID_TARGET_ARCH=arm64-v8a
          make -j"$(nproc)"

      - name: Locate APK outputs
        run: |
          set -euxo pipefail
          find . -type f \( -name '*debug*.apk' -o -name '*-debug.apk' \) | tee apk_files.txt
          test -s apk_files.txt

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sioyek-android-arm64-v8a-debug-apk
          path: |
            **/*debug*.apk
            apk_files.txt
